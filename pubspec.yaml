name: firebase
description: "A new Flutter project."
 
publish_to: 'none'
 
version: 1.0.0+1

environment:
  sdk: ^3.9.2
 
dependencies:
  flutter:
    sdk: flutter
 
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  get: ^4.7.2
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  image_picker: ^1.2.0
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.2
  shared_preferences: ^2.5.3 
  get_storage: 
  http: ^1.5.0
  google_fonts: 
  google_nav_bar: ^5.0.7
  glassmorphism: ^3.0.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0  
  animated_toggle_switch: ^0.8.5
  path_provider: ^2.1.5
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  flutter_local_notifications: ^20.1.0
  flutter_stripe: ^12.3.0
  flutter_dotenv: ^6.0.0
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^5.0.0

 
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
     
 

